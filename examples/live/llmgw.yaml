# Chat and embedding calls for the LLM gateway:  cpsim workloads run examples/live/llmgw.yaml
# LLMGW_URL and a client key in LLMGW_CLIENT_KEY (lg_...), or LLM_API_KEY (what ecoctl injects for `llm: true`; the aliases then default to
# LLM_CHAT_MODEL / EMBEDDING_MODEL). With neither, a service token with scope llmgw.use is used instead (CPSIM_OIDC_ISSUER +
# CPSIM_SERVICE_CLIENT_ID/_SECRET); the gateway matches its client id against the NAME of a registered client, so one named cpsim-service must exist.
workloads:
  - name: gateway-traffic
    kind: llmgw
    target_url: ${LLMGW_URL}
    token_env: LLMGW_CLIENT_KEY
    params:
      chat_models: [echo-chat]          # the gateway's model aliases
      embedding_models: [echo-embed]
      chat_pct: 80
      max_tokens_min: 16
      max_tokens_max: 128
    schedule:
      interval: 5
      batch: 2
      concurrency: 2
