[project]
name = "cpsim"
version = "0.1.0"
description = "CityPulse Simulator: cities of simulated sensors that speak Modbus TCP, EtherNet/IP, EtherCAT, PROFINET and PROFIBUS through an edge gateway."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "pymodbus>=3.7,<4"]

[project.scripts]
cpsim = "cpsim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
